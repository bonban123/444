<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page - Curso Online</title>
  <!-- Vinculamos el CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header>
    <h1>Curso Online de Meditación</h1>
    <p>Aprende a relajarte y mejorar tu bienestar</p>
  </header>

  <!-- ====== SECCIÓN PRINCIPAL ====== -->
  <section class="hero">
    <h2>Regístrate para más información</h2>
    <p>Déjanos tus datos y recibe acceso a recursos gratuitos, tips y mucho más.</p>

    <!-- ====== FORMULARIO ====== -->
    <form id="contactForm">
      <input type="text" id="name" placeholder="Nombre completo">
      <div id="errorName" class="error"></div>

      <input type="email" id="email" placeholder="Correo electrónico">
      <div id="errorEmail" class="error"></div>

      <textarea id="message" rows="4" placeholder="Escribe tu mensaje..."></textarea>
      <div id="errorMessage" class="error"></div>

      <button type="submit">Suscríbete</button>
    </form>
  </section>

  <!-- ====== FOOTER ====== -->
  <footer>
    <p>&copy; 2025 Curso de Meditación - Todos los derechos reservados</p>
  </footer>

  <!-- Vinculamos el JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
